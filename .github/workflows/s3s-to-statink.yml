name: Splatoon3 Battlelog Uploader

on:
  schedule:
    # UTC 10:10-16:10 = JST 19:10-25:10 (through the next day's 01:10).
    - cron: '10 10-16 * * *'
    # UTC 22:10 = JST 07:10 on the next day.
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Check authentication without uploading to stat.ink'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: s3s-to-statink
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout s3s
        uses: actions/checkout@v7.0.1
        with:
          repository: frozenpandaman/s3s
          ref: 732c91e5ac9b82a413f96bc75831996f8cf4f9ea
          path: s3s
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install -r s3s/requirements.txt
          npm install --global nxapi@1.6.1-next.257

      - name: Refresh authentication and upload missing results
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only && '1' || '0' }}
          NXAPI_USER_AGENT: 's3s-to-statink/2.0.0 (+https://github.com/lasty009/s3s-to-statink)'
          NXAPI_DEBUG_FILE: '0'
          NXAPI_SKIP_UPDATE_CHECK: '1'
          PYTHONUNBUFFERED: '1'
        run: python scripts/upload.py --s3s-dir s3s
